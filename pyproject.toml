[build-system]
requires = ["flit_core>=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "immich-on-demand"
version = "0.1.0"
description = "Expose an Immich library as a Linux filesystem with files on demand"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Immich On-Demand contributors" }]
dependencies = [
  "httpx>=0.28,<1",
  "Pillow>=11,<13",
  "pyfuse3>=3.4,<4",
  "SecretStorage>=3.3,<4",
  "trio>=0.30,<1",
]

[project.scripts]
immich-on-demand = "immich_on_demand.cli:main"

[project.urls]
Repository = "https://github.com/totalolage/immich-on-demand"

[tool.flit.module]
name = "immich_on_demand"
